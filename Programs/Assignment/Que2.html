<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Product Table</title>
<style>
    #product {
        margin: auto;
        border: 3px solid black;
        border-collapse: collapse;
        text-align: left;
    }
    #product th {
        background-color: blue;
        color: white;
        padding: 20px;
    }
    #product td {
        padding: 20px;
        border: 1px solid black;
    }
</style>
</head>
<body>
<table id="product">
    <thead>
        <tr>
            <th>Product Name</th>
            <th>Brand Name</th>
            <th>Price</th>
            <th>Quantity</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td>Smartphone</td>
            <td>Brand A</td>
            <td>$100</td>
            <td>50</td>
        </tr>
        <tr>
            <td>Laptop</td>
            <td>Brand B</td>
            <td>$1200</td>
            <td>30</td>
        </tr>
        <tr>
            <td>Headphones</td>
            <td>Brand C</td>
            <td>$50</td>
            <td>100</td>
        </tr>
    </tbody>
</table>
</body>
</html>
