<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajax XML load</title>
    <style>
        table,th,td {
        border : 1px solid black;
        border-collapse: collapse;
      }
      th,td {
        padding: 5px;
      }
    </style>
      
</head>
<body>
    <h1>Load XML Documents</h1>
    <button type="button" onclick="loadXMLDoc()">Get my CD collection </button>
    <br><br>
    <table id="demo"></table>

    <script>
        function loadXMLDoc() {
            var xhttp = new XMLHttpRequest();// constructor
            xhttp.onload = function() {
                var xmlDoc = xhttp.responseXML;
                var cd = xmlDoc.getElementsByTagName("CD");
                myFunction(cd)
            }
            xhttp.onerror = function() {
                document.getElementById("demo").innerHTML =
                "Error loading XML document.";
            }
            xhttp.open("GET", "cd_catalog.xml");
            xhttp.send();
        }

    function myFunction(cd) {
    let table="<tr><th>Artist</th><th>Title</th><th>Country</th><th>Company</th><th>Price</th><th>Year</th></tr>";
    for (let i = 0; i < cd.length; i++) { 
        table += "<tr><td>" +
        cd[i].getElementsByTagName("ARTIST")[0].childNodes[0].nodeValue +
         "</td><td>" +
        cd[i].getElementsByTagName("TITLE")[0].childNodes[0].nodeValue + 
        "</td><td>"+
        cd[i].getElementsByTagName("COUNTRY")[0].childNodes[0].nodeValue + 
        "</td><td>"+
        cd[i].getElementsByTagName("COMPANY")[0].childNodes[0].nodeValue +
        "</td><td>" +
        cd[i].getElementsByTagName("PRICE")[0].childNodes[0].nodeValue+
         "</td><td>"+
        cd[i].getElementsByTagName("YEAR")[0].childNodes[0].nodeValue +
        "</td></tr>";
    }
    document.getElementById("demo").innerHTML = table;
    }
    </script>

</body>
</html>
