<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hosting</title>
</head>
<body>
    <h1>Hoisting</h1>
    <script>
        function codeHoist() {
        a = 10;
        let b = 50;  // inside so can not be used outside funct
    }
    codeHoist();

    console.log(a); // 10 
    console.log(b); // ReferenceError : b is not defined

    </script>
</body>
</html>
