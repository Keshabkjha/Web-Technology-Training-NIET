<!DOCTYPE html>
<html>
<body>
<h2>Converting a JavaScript object And JavaScript Array in to JSON string</h2>

<h3>1. Creating a JSON string from a JavaScript object</h3>
<p id="obj"></p>

<h3>2. Creating a JSON string from a JavaScript Array</h3>
<p id="aray"></p>

<script>
const emp = {EmployeeName: "Ravi", experience: 5, Qualificatio:"B Tech- IT",city: "New Delhi"};
const myJSONObj = JSON.stringify(emp);
document.getElementById("obj").innerHTML = myJSONObj;

const fruits = ["Apples", "Pears", "Oranges", "Grapes"];
const myJSONAray = JSON.stringify(fruits);
document.getElementById("aray").innerHTML = myJSONAray;
</script>
</body>
</html>
