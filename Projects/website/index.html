<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full stack Training</title>
    <style>
        p{
            background-color: aqua;
        }
        img{
            border-radius: 50%;
            opacity: 0.6;
            transition: transform 0.2s;
            height: auto;
            width: auto;
        }
        
        img:hover{
            opacity: 1;
            transform:scale(1.1);
        }
        .thumb{
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 4px;
            width: 150px;  
            height: auto;
        }
        .caption{
            text-align: center;
            font-size: 14px;
            color: #555;
        }
    </style>
</head>
<body>
    <h1>Welcome to my website</h1>
    <p>this site is helpful for providing information on front end web design</p>
    <p> this is good one</p>

    <a href="http://youtube.com/@Apple"> Youtube</a>
    <img src="appl.gif" alt="hello" >
    <figure>
    <img src="river.jpeg" alt="river" class="thumb">
    <figcaption class="caption">A beautiful river</figcaption>
    </figure>
</body>
</html>
