<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Collaborative Notepad</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="/socket.io/socket.io.js"></script>
    <script defer src="client.js"></script>
</head>
<body>
    <!-- Toolbar with Icons -->
    <nav id="toolbar">
        <button id="draw-tool" class="tool-button" title="Draw Tool">
            <img src="icons/draw.svg" alt="Draw">
        </button>
        <button id="eraser-tool" class="tool-button" title="Eraser Tool">
            <img src="icons/eraser.svg" alt="Eraser">
        </button>
        <button id="color-picker" class="tool-button" title="Pick Color">
            <img src="icons/color.svg" alt="Color Picker">
        </button>
        <button id="clear-canvas" class="tool-button" title="Clear Canvas">
            <img src="icons/clear.svg" alt="Clear">
        </button>
        <button id="theme-toggle" class="tool-button" title="Toggle Light/Dark Theme">
            <img src="icons/theme.svg" alt="Theme Toggle">
        </button>
    </nav>

    <!-- Main Content Area -->
    <main>
        <div id="canvas-container">
            <canvas id="drawing-canvas"></canvas>
        </div>
        <div id="chat-container">
            <ul id="messages"></ul>
            <form id="chat-input">
                <input id="message" type="text" placeholder="Type a message..." autocomplete="off" />
                <button id="send" type="submit">Send</button>
            </form>
            <div id="online-count">0 users online</div>
        </div>
    </main>
</body>
</html>
